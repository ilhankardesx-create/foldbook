name: Fix Curl Frame Shadow

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/fix-curl-frame-shadow.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Apply curl frame shadow fix
        run: python3 scripts/fix_curl_frame_shadow.py

      - name: Commit patch
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt \
                  app/src/main/java/com/foldbook/app/PdfReader.kt
          git commit -m "Remove duplicate frame shadow from turning sheet"
          git push origin HEAD:development
