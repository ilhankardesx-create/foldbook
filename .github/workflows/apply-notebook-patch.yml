name: Apply Not Defteri Patch

on:
  push:
    branches: [ "development" ]
    paths:
      - ".github/workflows/apply-notebook-patch.yml"

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Patch MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/foldbook/app/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          start_marker = "    if (notesVisible) {\n"
          end_marker = "    actionBook?.let { book ->"
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit("Notlar popup bloğu bulunamadı; dosya değiştirilmedi.")

          replacement = '''    if (notesVisible) {
              NotebookScreen(
                  notes = notes,
                  books = books,
                  onBack = { notesVisible = false },
                  onDeleteNote = { noteId ->
                      LibraryStore.deleteNote(context, noteId)
                      notes = LibraryStore.readNotes(context)
                  }
              )
              return
          }

          '''

          text = text[:start] + replacement + text[end:]

          replacements = {
              'Text("Notlar")': 'Text("Not Defteri")',
              '"Notlara eklendi."': '"Not Defterine eklendi."',
              'Text("Notlara Ekle")': 'Text("Not Defterine Ekle")',
              'text = "v0.9.32"': 'text = "v0.9.33"',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Beklenen metin bulunamadı: {old}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify final development build
        run: gradle assembleDebug --stacktrace

      - name: Commit final patch to development
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt
          git rm .github/workflows/apply-notebook-patch.yml
          git commit -m "Add professional Not Defteri screen"
          git push origin HEAD:development

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldBook-0.9.33-Not-Defteri
          path: app/build/outputs/apk/debug/app-debug.apk
