name: FoldBook EPUB Bottom Clip Fix

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/footer-clip-fix-once.yml"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix EPUB bottom clipping and lower page number
        shell: python
        run: |
          from pathlib import Path

          main = Path("app/src/main/java/com/foldbook/app/MainActivity.kt")
          text = main.read_text(encoding="utf-8")

          replacements = [
              (
                  'val bottomSafetyPx = (bodyLineHeightPx * 0.35f).toInt()',
                  'val bottomSafetyPx = (bodyLineHeightPx * 1.0f).toInt()'
              ),
              (
                  '(44f * density) -      // üst + alt sayfa iç boşluğu',
                  '(28f * density) -      // üst 22dp + alt 6dp sayfa iç boşluğu'
              ),
              (
                  '(24f * density) -      // gerçek sayfa numarası alanı',
                  '(20f * density) -      // aşağı alınmış sayfa numarası alanı'
              ),
              (
                  '.padding(horizontal = 28.dp, vertical = 22.dp)',
                  '.padding(start = 28.dp, top = 22.dp, end = 28.dp, bottom = 6.dp)'
              ),
              (
                  '.align(Alignment.CenterHorizontally)\n                        .padding(top = 6.dp)',
                  '.align(Alignment.CenterHorizontally)\n                        .padding(top = 2.dp)'
              ),
              ('text = "v0.9.19"', 'text = "v0.9.20"'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Beklenen kaynak bulunamadı: {old}")
              text = text.replace(old, new, 1)

          main.write_text(text, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 30' not in g or 'versionName = "0.9.19"' not in g:
              raise SystemExit("Beklenen 0.9.19 sürüm bilgisi bulunamadı.")
          g = g.replace('versionCode = 30', 'versionCode = 31', 1)
          g = g.replace('versionName = "0.9.19"', 'versionName = "0.9.20"', 1)
          gradle.write_text(g, encoding="utf-8")

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK and release AAB
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foldbook-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: foldbook-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Commit source update and remove helper workflow
        run: |
          git config user.name "ilhankardesx-create"
          git config user.email "ilhankardesx@gmail.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt app/build.gradle.kts
          git rm .github/workflows/footer-clip-fix-once.yml
          git commit -m "Prevent EPUB bottom line clipping"
          git push origin main
