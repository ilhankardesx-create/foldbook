name: Add Bundled FoldBook Guide

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/add-bundled-guide.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Generate EPUB and wire it into library
        run: python3 scripts/add_bundled_guide.py

      - name: Commit guide
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/assets/books/foldbook_kullanim_kilavuzu.epub app/src/main/java/com/foldbook/app/MainActivity.kt
          git commit -m "Bundle FoldBook usage guide EPUB"
          git push origin HEAD:development
