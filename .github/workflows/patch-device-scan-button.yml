name: Patch Device Scan Button

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/patch-device-scan-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0

      - name: Patch FoldBook device scan UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/com/foldbook/app/MainActivity.kt')
          text = main_path.read_text(encoding='utf-8')

          old = '''    fun openBook(book: LibraryBook) {\n'''
          new = '''    fun scanDeviceBooks() {\n        scope.launch {\n            libraryLoading = true\n            libraryError = null\n\n            runCatching {\n                withContext(Dispatchers.IO) {\n                    DeviceBookScanner.scan(context)\n                }\n            }.onSuccess { found ->\n                library = (library + found)\n                    .distinctBy { book ->\n                        "${book.title.lowercase()}|${book.format.name}|${book.modifiedAt / 1000L}"\n                    }\n                    .sortedWith(\n                        compareByDescending<LibraryBook> { it.modifiedAt }\n                            .thenBy { it.title.lowercase() }\n                    )\n\n                Toast.makeText(\n                    context,\n                    if (found.isEmpty()) {\n                        "Cihazda PDF veya EPUB bulunamadı."\n                    } else {\n                        "${found.size} kitap bulundu."\n                    },\n                    Toast.LENGTH_SHORT\n                ).show()\n            }.onFailure {\n                libraryError = it.message ?: "Cihazdaki kitaplar taranamadı."\n            }\n\n            libraryLoading = false\n        }\n    }\n\n    fun openBook(book: LibraryBook) {\n'''
          if old not in text:
              raise SystemExit('MainActivity scan insertion anchor not found')
          text = text.replace(old, new, 1)

          old = '''            onRefresh = {\n                LibraryStore.savedFolder(context)?.let { scanFolder(it) }\n            },\n            onBookClick = ::openBook,\n'''
          new = '''            onRefresh = {\n                LibraryStore.savedFolder(context)?.let { scanFolder(it) }\n            },\n            onScanDevice = ::scanDeviceBooks,\n            onBookClick = ::openBook,\n'''
          if old not in text:
              raise SystemExit('LibraryScreen call anchor not found')
          text = text.replace(old, new, 1)

          old = '''    onChooseFolder: () -> Unit,\n    onRefresh: () -> Unit,\n    onBookClick: (LibraryBook) -> Unit,\n'''
          new = '''    onChooseFolder: () -> Unit,\n    onRefresh: () -> Unit,\n    onScanDevice: () -> Unit,\n    onBookClick: (LibraryBook) -> Unit,\n'''
          if old not in text:
              raise SystemExit('LibraryScreen signature anchor not found')
          text = text.replace(old, new, 1)

          old = '''                            }\n\n                            Text(\n                                text = "Tema",\n'''
          new = '''                            }\n\n                            Button(\n                                onClick = onScanDevice,\n                                enabled = !isLoading,\n                                modifier = Modifier.fillMaxWidth()\n                            ) {\n                                Text(\n                                    if (isLoading) {\n                                        "Taranıyor…"\n                                    } else {\n                                        "Cihazdaki Bütün Kitapları Bul"\n                                    },\n                                    textAlign = TextAlign.Center\n                                )\n                            }\n\n                            Text(\n                                text = "Tema",\n'''
          if old not in text:
              raise SystemExit('Settings button insertion anchor not found')
          text = text.replace(old, new, 1)
          main_path.write_text(text, encoding='utf-8')

          store_path = Path('app/src/main/java/com/foldbook/app/LibraryStore.kt')
          store = store_path.read_text(encoding='utf-8')

          old = '''        return if (value.isNullOrBlank()) {\n            Uri.parse(DEVICE_LIBRARY_URI)\n        } else {\n            runCatching { Uri.parse(value) }.getOrElse { Uri.parse(DEVICE_LIBRARY_URI) }\n        }\n'''
          new = '''        return value\n            ?.takeIf { it.isNotBlank() }\n            ?.let { runCatching { Uri.parse(it) }.getOrNull() }\n'''
          if old not in store:
              raise SystemExit('savedFolder restoration anchor not found')
          store = store.replace(old, new, 1)

          old = '''\n        result += DeviceBookScanner.scan(context)\n\n        return result\n'''
          new = '''\n        return result\n'''
          if old not in store:
              raise SystemExit('scanFolder device merge anchor not found')
          store = store.replace(old, new, 1)

          store = store.replace('    private const val DEVICE_LIBRARY_URI = "foldbook://device-library"\n', '', 1)
          store_path.write_text(store, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt app/src/main/java/com/foldbook/app/LibraryStore.kt
          git commit -m "Add explicit device book scan button"
          git push origin HEAD:development
