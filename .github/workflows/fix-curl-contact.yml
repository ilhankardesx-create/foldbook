name: Fix Curl Contact

on:
  push:
    branches: [ "development" ]
    paths:
      - ".github/workflows/fix-curl-contact.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: development
      - name: Apply patch
        run: python3 scripts/fix_curl_contact.py
      - name: Commit patch
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/PageCurl.kt app/src/main/java/com/foldbook/app/MainActivity.kt
          git commit -m "Fix curl touch direction and handoff tone"
          git push origin HEAD:development
