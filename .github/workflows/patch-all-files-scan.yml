name: Patch All Files Scan

on:
  push:
    branches:
      - development
    paths:
      - .github/workflows/patch-all-files-scan.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0

      - name: Patch readers and permission flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          epub_path = Path('app/src/main/java/com/foldbook/app/EpubLoader.kt')
          epub = epub_path.read_text(encoding='utf-8')
          anchor = 'context.contentResolver.openInputStream(uri)'
          if anchor not in epub and 'context.openBookInputStream(uri)' not in epub:
              raise SystemExit('EPUB input stream anchor not found')
          epub = epub.replace(anchor, 'context.openBookInputStream(uri)')
          epub_path.write_text(epub, encoding='utf-8')

          pdf_path = Path('app/src/main/java/com/foldbook/app/PdfReader.kt')
          pdf = pdf_path.read_text(encoding='utf-8')
          anchor = 'context.contentResolver.openFileDescriptor(uri, "r")'
          if anchor not in pdf and 'context.openBookFileDescriptor(uri, "r")' not in pdf:
              raise SystemExit('PDF descriptor anchor not found')
          pdf = pdf.replace(anchor, 'context.openBookFileDescriptor(uri, "r")')
          pdf_path.write_text(pdf, encoding='utf-8')

          main_path = Path('app/src/main/java/com/foldbook/app/MainActivity.kt')
          main = main_path.read_text(encoding='utf-8')
          if 'import android.os.Build\n' not in main:
              main = main.replace(
                  'import android.os.Bundle\n',
                  'import android.os.Build\nimport android.os.Bundle\nimport android.os.Environment\nimport android.provider.Settings\n',
                  1
              )

          if 'fun scanDeviceBooksWithPermission()' not in main:
              marker = '    LaunchedEffect(Unit) {\n        LibraryStore.savedFolder(context)?.let { scanFolder(it) }\n'
              if marker not in main:
                  raise SystemExit('MainActivity permission insertion anchor not found')
              lines = [
                  '    val allFilesAccessLauncher = rememberLauncherForActivityResult(',
                  '        contract = ActivityResultContracts.StartActivityForResult()',
                  '    ) {',
                  '        if (',
                  '            Build.VERSION.SDK_INT < Build.VERSION_CODES.R ||',
                  '            Environment.isExternalStorageManager()',
                  '        ) {',
                  '            scanDeviceBooks()',
                  '        } else {',
                  '            Toast.makeText(',
                  '                context,',
                  '                "Dosya erişim izni verilmedi.",',
                  '                Toast.LENGTH_SHORT',
                  '            ).show()',
                  '        }',
                  '    }',
                  '',
                  '    fun scanDeviceBooksWithPermission() {',
                  '        if (',
                  '            Build.VERSION.SDK_INT >= Build.VERSION_CODES.R &&',
                  '            !Environment.isExternalStorageManager()',
                  '        ) {',
                  '            val appSettings = Intent(',
                  '                Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,',
                  '                Uri.parse("package:${context.packageName}")',
                  '            )',
                  '            try {',
                  '                allFilesAccessLauncher.launch(appSettings)',
                  '            } catch (_: Exception) {',
                  '                allFilesAccessLauncher.launch(',
                  '                    Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)',
                  '                )',
                  '            }',
                  '        } else {',
                  '            scanDeviceBooks()',
                  '        }',
                  '    }',
                  ''
              ]
              permission_code = '\n'.join(lines) + '\n'
              main = main.replace(marker, permission_code + marker, 1)

          if 'onScanDevice = ::scanDeviceBooks,' in main:
              main = main.replace(
                  'onScanDevice = ::scanDeviceBooks,',
                  'onScanDevice = ::scanDeviceBooksWithPermission,',
                  1
              )
          elif 'onScanDevice = ::scanDeviceBooksWithPermission,' not in main:
              raise SystemExit('MainActivity onScanDevice anchor not found')

          main_path.write_text(main, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/EpubLoader.kt app/src/main/java/com/foldbook/app/PdfReader.kt app/src/main/java/com/foldbook/app/MainActivity.kt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Connect one-time storage permission and file readers"
            git push origin HEAD:development
          fi
