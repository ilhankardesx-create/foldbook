name: Fix Single Book Picker State

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/fix-single-book-picker-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0

      - name: Fix single-book picker state
        run: python3 scripts/fix_single_book_picker_state.py

      - name: Commit picker state fix
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Keep existing books when adding one file"
          git push origin development
