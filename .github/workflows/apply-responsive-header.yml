name: Format responsive library header

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize responsive header formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path("app/src/main/java/com/foldbook/app/MainActivity.kt")
          text = path.read_text(encoding="utf-8")
          marker = "val veryCompactHeader = maxWidth < 360.dp"
          marker_pos = text.find(marker)
          if marker_pos < 0:
              raise SystemExit("Responsive header marker not found; refusing to modify anything.")

          start = text.rfind("            BoxWithConstraints(\n", 0, marker_pos)
          end_marker = "\n\n            OutlinedTextField("
          end = text.find(end_marker, marker_pos)
          if start < 0 or end < 0:
              raise SystemExit("Responsive header boundaries not found; refusing to modify anything.")

          clean = dedent('''\
          BoxWithConstraints(
              modifier = Modifier.fillMaxWidth()
          ) {
              val veryCompactHeader = maxWidth < 360.dp
              val compactHeader = maxWidth < 430.dp
              val headerHorizontalPadding = when {
                  veryCompactHeader -> 8.dp
                  compactHeader -> 12.dp
                  else -> 16.dp
              }
              val headerButtonHorizontalPadding = when {
                  veryCompactHeader -> 2.dp
                  compactHeader -> 4.dp
                  else -> 8.dp
              }
              val headerMenuFontSize = when {
                  veryCompactHeader -> 12.sp
                  compactHeader -> 13.sp
                  else -> 14.sp
              }
              val headerTitleFontSize = when {
                  veryCompactHeader -> 17.sp
                  compactHeader -> 18.sp
                  else -> 19.sp
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = headerHorizontalPadding, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(
                      text = "Kütüphane",
                      modifier = Modifier.weight(1f),
                      fontSize = headerTitleFontSize,
                      fontFamily = FontFamily.Serif,
                      fontWeight = FontWeight.Bold,
                      maxLines = 1,
                      softWrap = false,
                      color = MaterialTheme.colorScheme.onSurface
                  )

                  TextButton(
                      onClick = {
                          notes = LibraryStore.readNotes(context)
                          notesVisible = true
                      },
                      contentPadding = androidx.compose.foundation.layout.PaddingValues(
                          horizontal = headerButtonHorizontalPadding,
                          vertical = 8.dp
                      )
                  ) {
                      Text(
                          text = "Not Defteri",
                          fontSize = headerMenuFontSize,
                          maxLines = 1,
                          softWrap = false
                      )
                  }

                  TextButton(
                      onClick = { settingsVisible = !settingsVisible },
                      contentPadding = androidx.compose.foundation.layout.PaddingValues(
                          horizontal = headerButtonHorizontalPadding,
                          vertical = 8.dp
                      )
                  ) {
                      Text(
                          text = "Ayarlar",
                          fontSize = headerMenuFontSize,
                          maxLines = 1,
                          softWrap = false
                      )
                  }

                  TextButton(
                      onClick = {
                          supportBilling.clearMessage()
                          supportVisible = true
                      },
                      contentPadding = androidx.compose.foundation.layout.PaddingValues(
                          horizontal = headerButtonHorizontalPadding,
                          vertical = 8.dp
                      )
                  ) {
                      Text(
                          text = "Destek",
                          fontSize = headerMenuFontSize,
                          maxLines = 1,
                          softWrap = false
                      )
                  }
              }
          }
          ''')
          new_block = indent(clean.rstrip("\n"), "            ")

          if text[start:end] == new_block:
              print("Responsive header formatting is already clean.")
              raise SystemExit(0)

          path.write_text(text[:start] + new_block + text[end:], encoding="utf-8")
          PY

          git diff --check

      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/foldbook/app/MainActivity.kt; then
            echo "No source change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt
          git commit -m "Format responsive library header"
          git push origin HEAD:main
