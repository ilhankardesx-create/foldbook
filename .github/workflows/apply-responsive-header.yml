name: Apply responsive library header

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply responsive header patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch library header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/foldbook/app/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          old = '''            Row(
                modifier = Modifier
                    .fillMaxWidth()
                    .padding(horizontal = 16.dp, vertical = 10.dp),
                verticalAlignment = Alignment.CenterVertically
            ) {
                Text(
                    text = "Kütüphane",
                    modifier = Modifier.weight(1f),
                    fontSize = 19.sp,
                    fontFamily = FontFamily.Serif,
                    fontWeight = FontWeight.Bold,
                    maxLines = 1,
                    softWrap = false,
                    color = MaterialTheme.colorScheme.onSurface
                )

                TextButton(
                    onClick = {
                        notes = LibraryStore.readNotes(context)
                        notesVisible = true
                    }
                ) {
                    Text("Not Defteri")
                }

                TextButton(
                    onClick = { settingsVisible = !settingsVisible }
                ) {
                    Text("Ayarlar")
                }

                TextButton(
                    onClick = {
                        supportBilling.clearMessage()
                        supportVisible = true
                    }
                ) {
                    Text("Destek")
                }
            }
'''

          new = '''            BoxWithConstraints(
                modifier = Modifier.fillMaxWidth()
            ) {
                val veryCompactHeader = maxWidth < 360.dp
                val compactHeader = maxWidth < 430.dp
                val headerHorizontalPadding = when {
                    veryCompactHeader -> 8.dp
                    compactHeader -> 12.dp
                    else -> 16.dp
                }
                val headerButtonHorizontalPadding = when {
                    veryCompactHeader -> 2.dp
                    compactHeader -> 4.dp
                    else -> 8.dp
                }
                val headerMenuFontSize = when {
                    veryCompactHeader -> 12.sp
                    compactHeader -> 13.sp
                    else -> 14.sp
                }
                val headerTitleFontSize = when {
                    veryCompactHeader -> 17.sp
                    compactHeader -> 18.sp
                    else -> 19.sp
                }

                Row(
                    modifier = Modifier
                        .fillMaxWidth()
                        .padding(horizontal = headerHorizontalPadding, vertical = 10.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Text(
                        text = "Kütüphane",
                        modifier = Modifier.weight(1f),
                        fontSize = headerTitleFontSize,
                        fontFamily = FontFamily.Serif,
                        fontWeight = FontWeight.Bold,
                        maxLines = 1,
                        softWrap = false,
                        color = MaterialTheme.colorScheme.onSurface
                    )

                    TextButton(
                        onClick = {
                            notes = LibraryStore.readNotes(context)
                            notesVisible = true
                        },
                        contentPadding = androidx.compose.foundation.layout.PaddingValues(
                            horizontal = headerButtonHorizontalPadding,
                            vertical = 8.dp
                        )
                    ) {
                        Text(
                            text = "Not Defteri",
                            fontSize = headerMenuFontSize,
                            maxLines = 1,
                            softWrap = false
                        )
                    }

                    TextButton(
                        onClick = { settingsVisible = !settingsVisible },
                        contentPadding = androidx.compose.foundation.layout.PaddingValues(
                            horizontal = headerButtonHorizontalPadding,
                            vertical = 8.dp
                        )
                    ) {
                        Text(
                            text = "Ayarlar",
                            fontSize = headerMenuFontSize,
                            maxLines = 1,
                            softWrap = false
                        )
                    }

                    TextButton(
                        onClick = {
                            supportBilling.clearMessage()
                            supportVisible = true
                        },
                        contentPadding = androidx.compose.foundation.layout.PaddingValues(
                            horizontal = headerButtonHorizontalPadding,
                            vertical = 8.dp
                        )
                    ) {
                        Text(
                            text = "Destek",
                            fontSize = headerMenuFontSize,
                            maxLines = 1,
                            softWrap = false
                        )
                    }
                }
            }
'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one library header block, found {count}; refusing to modify anything.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          git diff -- app/src/main/java/com/foldbook/app/MainActivity.kt

      - name: Commit responsive header
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt
          git commit -m "Make library header responsive"
          git push origin HEAD:main
