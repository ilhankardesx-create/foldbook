name: Fix Single Page Frame Shadow

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/fix-single-page-frame-shadow.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Apply single-page frame shadow fix
        run: python3 scripts/fix_single_page_frame_shadow.py

      - name: Commit patch
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt
          git commit -m "Keep single-page frame shadow stable during curl"
          git push origin HEAD:development
