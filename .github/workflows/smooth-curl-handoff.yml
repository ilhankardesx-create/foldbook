name: Smooth Curl Handoff

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/smooth-curl-handoff.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply curl patch
        env:
          PATCH_B64: ""
        run: |
          echo "$PATCH_B64" | base64 --decode | python3
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt app/src/main/java/com/foldbook/app/PdfReader.kt app/src/main/java/com/foldbook/app/PageCurl.kt
          git commit -m "Smooth page curl handoff and finger angle"
          git push origin HEAD:development
