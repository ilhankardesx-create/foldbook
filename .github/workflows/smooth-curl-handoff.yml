name: Smooth Curl Handoff

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/smooth-curl-handoff.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Smooth page settle and make curl angle follow finger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # EPUB reader: keep the final curl frame for one display frame while the
          # destination page recomposes underneath it, then remove the overlay.
          main = Path('app/src/main/java/com/foldbook/app/MainActivity.kt')
          s = main.read_text()
          if 'import androidx.compose.runtime.withFrameNanos' not in s:
              s = s.replace(
                  'import androidx.compose.runtime.staticCompositionLocalOf\n',
                  'import androidx.compose.runtime.staticCompositionLocalOf\nimport androidx.compose.runtime.withFrameNanos\n',
                  1,
              )

          epub_pattern = re.compile(
              r'''(?P<indent>\s*)Snapshot\.withMutableSnapshot \{\n'''
              r'''(?P=indent)    pageIndex = newIndex\n'''
              r'''(?P=indent)    dragPx = 0f\n'''
              r'''(?P=indent)    dragProgress = 0f\n'''
              r'''(?P=indent)    dragYFraction = 0\.5f\n'''
              r'''(?P=indent)    turnDirection = 0\n'''
              r'''(?P=indent)    settling = false\n'''
              r'''(?P=indent)\}\n'''
              r'''(?P=indent)onPageChanged\(newIndex\)'''
          )

          def epub_repl(m):
              i = m.group('indent')
              return (
                  f'{i}Snapshot.withMutableSnapshot {{\n'
                  f'{i}    pageIndex = newIndex\n'
                  f'{i}}}\n'
                  f'{i}onPageChanged(newIndex)\n'
                  f'{i}// Keep the frozen final curl above the newly composed page for one frame.\n'
                  f'{i}withFrameNanos {{ }}\n'
                  f'{i}Snapshot.withMutableSnapshot {{\n'
                  f'{i}    dragPx = 0f\n'
                  f'{i}    dragProgress = 0f\n'
                  f'{i}    dragYFraction = 0.5f\n'
                  f'{i}    turnDirection = 0\n'
                  f'{i}    settling = false\n'
                  f'{i}}}'
              )

          s, epub_count = epub_pattern.subn(epub_repl, s)
          if epub_count < 1:
              raise SystemExit('EPUB settle handoff block not found')
          main.write_text(s)

          # PDF reader: same frame-synchronised handoff. PDF rendering is heavier,
          # so this removes the especially visible post-turn refresh/flicker.
          pdf = Path('app/src/main/java/com/foldbook/app/PdfReader.kt')
          s = pdf.read_text()
          if 'import androidx.compose.runtime.withFrameNanos' not in s:
              s = s.replace(
                  'import androidx.compose.runtime.setValue\n',
                  'import androidx.compose.runtime.setValue\nimport androidx.compose.runtime.withFrameNanos\n',
                  1,
              )

          pdf_pattern = re.compile(
              r'''(?P<indent>\s*)Snapshot\.withMutableSnapshot \{\n'''
              r'''(?P=indent)    pageIndex = newIndex\n'''
              r'''(?P=indent)    dragPx = 0f\n'''
              r'''(?P=indent)    dragProgress = 0f\n'''
              r'''(?P=indent)    turnDirection = 0\n'''
              r'''(?P=indent)    settling = false\n'''
              r'''(?P=indent)\}\n'''
              r'''(?P=indent)onPageChanged\(newIndex\)'''
          )

          def pdf_repl(m):
              i = m.group('indent')
              return (
                  f'{i}Snapshot.withMutableSnapshot {{\n'
                  f'{i}    pageIndex = newIndex\n'
                  f'{i}}}\n'
                  f'{i}onPageChanged(newIndex)\n'
                  f'{i}// Let the destination bitmap/page settle behind the frozen curl.\n'
                  f'{i}withFrameNanos {{ }}\n'
                  f'{i}Snapshot.withMutableSnapshot {{\n'
                  f'{i}    dragPx = 0f\n'
                  f'{i}    dragProgress = 0f\n'
                  f'{i}    turnDirection = 0\n'
                  f'{i}    settling = false\n'
                  f'{i}}}'
              )

          s, pdf_count = pdf_pattern.subn(pdf_repl, s)
          if pdf_count < 1:
              raise SystemExit('PDF settle handoff block not found')
          pdf.write_text(s)

          # Curl geometry: horizontal finger movement controls progress as before;
          # vertical movement now directly changes the fold-line angle.
          curl = Path('app/src/main/java/com/foldbook/app/PageCurl.kt')
          s = curl.read_text()
          old = '''                val rowSkew =
                    (v - touchY) * 0.11f * wave *
                        if (forward) 1f else -1f
'''
          new = '''                // Vertical finger movement now changes the fold-line angle,
                // not just its pivot. High/low drags visibly tilt the travelling curl.
                val tilt = (touchY - 0.5f) * 0.58f * wave
                val rowSkew =
                    (v - 0.5f) * tilt *
                        if (forward) 1f else -1f
'''
          if old not in s:
              raise SystemExit('PageCurl rowSkew block not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '(touchY - 0.5f) * height * 0.030f *',
              '(touchY - 0.5f) * height * 0.050f *',
              1,
          )
          curl.write_text(s)

          print(f'EPUB handoff blocks patched: {epub_count}')
          print(f'PDF handoff blocks patched: {pdf_count}')
          PY

          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt \
                  app/src/main/java/com/foldbook/app/PdfReader.kt \
                  app/src/main/java/com/foldbook/app/PageCurl.kt
          git commit -m "Smooth page curl handoff and finger angle"
          git push origin HEAD:development
