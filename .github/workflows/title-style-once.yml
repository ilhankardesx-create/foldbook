name: FoldBook Library Title Update

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/title-style-once.yml"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update library title style
        shell: python
        run: |
          from pathlib import Path

          main = Path("app/src/main/java/com/foldbook/app/MainActivity.kt")
          text = main.read_text(encoding="utf-8")
          lines = text.splitlines()

          idx = next(
              (i for i, line in enumerate(lines) if line.strip() == 'text = "Kütüphane",'),
              None
          )
          if idx is None or idx < 1 or lines[idx - 1].strip() != "Text(":
              raise SystemExit("Kütüphane başlığı bulunamadı; dosya değiştirilmedi.")

          prop_indent = lines[idx][:len(lines[idx]) - len(lines[idx].lstrip())]
          if lines[idx + 1].strip() != "modifier = Modifier.weight(1f),":
              raise SystemExit("Kütüphane başlık düzeni beklenenden farklı.")

          lines[idx:idx + 5] = [
              prop_indent + 'text = "Kütüphane",',
              prop_indent + 'modifier = Modifier.weight(1f),',
              prop_indent + 'fontSize = 22.sp,',
              prop_indent + 'fontFamily = FontFamily.Serif,',
              prop_indent + 'fontWeight = FontWeight.Bold,',
              prop_indent + 'maxLines = 1,',
              prop_indent + 'softWrap = false,',
              prop_indent + 'color = MaterialTheme.colorScheme.onSurface',
          ]

          text = "\n".join(lines) + "\n"
          if 'text = "v0.9.17"' not in text:
              raise SystemExit("Ayarlar ekranındaki v0.9.17 yazısı bulunamadı.")
          text = text.replace('text = "v0.9.17"', 'text = "v0.9.18"', 1)
          main.write_text(text, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 28' not in g or 'versionName = "0.9.17"' not in g:
              raise SystemExit("Beklenen 0.9.17 sürüm bilgisi bulunamadı.")
          g = g.replace('versionCode = 28', 'versionCode = 29', 1)
          g = g.replace('versionName = "0.9.17"', 'versionName = "0.9.18"', 1)
          gradle.write_text(g, encoding="utf-8")

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK and release AAB
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foldbook-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: foldbook-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Commit source update and remove helper workflow
        run: |
          git config user.name "ilhankardesx-create"
          git config user.email "ilhankardesx@gmail.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt app/build.gradle.kts
          git rm .github/workflows/title-style-once.yml
          git commit -m "Style library title across all layouts"
          git push origin main
