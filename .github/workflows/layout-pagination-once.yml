name: FoldBook Layout Pagination Update

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/layout-pagination-once.yml"

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update title and EPUB pagination
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path("app/src/main/java/com/foldbook/app/MainActivity.kt")
          text = main.read_text(encoding="utf-8")

          title_pattern = re.compile(
              r'(text = "Kütüphane",\s*\n\s*modifier = Modifier\.weight\(1f\),\s*\n\s*fontSize = )22(\.sp,)'
          )
          text, title_count = title_pattern.subn(r'\g<1>19\2', text, count=1)
          if title_count != 1:
              raise SystemExit("Kütüphane font boyutu bulunamadı; dosya değiştirilmedi.")

          old_safety = 'val bottomSafetyPx = (bodyLineHeightPx * 1.85f).toInt()'
          new_safety = 'val bottomSafetyPx = (bodyLineHeightPx * 0.35f).toInt()'
          if old_safety not in text:
              raise SystemExit("EPUB alt güvenlik alanı bulunamadı; dosya değiştirilmedi.")
          text = text.replace(old_safety, new_safety, 1)

          old_footer = '(30f * density) -      // sayfa numarası alanı'
          new_footer = '(24f * density) -      // gerçek sayfa numarası alanı'
          if old_footer not in text:
              raise SystemExit("Sayfa numarası alanı bulunamadı; dosya değiştirilmedi.")
          text = text.replace(old_footer, new_footer, 1)

          text = text.replace(
              '// Compose ile StaticLayout arasındaki küçük font ölçüm farklarında\n    // son satırın kesilmemesi için yaklaşık iki satırlık güvenli alan.',
              '// StaticLayout satır altlarını gerçek piksel yüksekliğiyle ölçüyor.\n    // Yalnızca küçük Compose/StaticLayout farkı için ince bir güvenlik payı bırakıyoruz.',
              1
          )

          if 'text = "v0.9.18"' not in text:
              raise SystemExit("Ayarlar sürüm etiketi 0.9.18 bulunamadı.")
          text = text.replace('text = "v0.9.18"', 'text = "v0.9.19"', 1)
          main.write_text(text, encoding="utf-8")

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text(encoding="utf-8")
          if 'versionCode = 29' not in g or 'versionName = "0.9.18"' not in g:
              raise SystemExit("Beklenen 0.9.18 sürüm bilgisi bulunamadı.")
          g = g.replace('versionCode = 29', 'versionCode = 30', 1)
          g = g.replace('versionName = "0.9.18"', 'versionName = "0.9.19"', 1)
          gradle.write_text(g, encoding="utf-8")

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK and release AAB
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foldbook-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: foldbook-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Commit source update and remove helper workflow
        run: |
          git config user.name "ilhankardesx-create"
          git config user.email "ilhankardesx@gmail.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt app/build.gradle.kts
          git rm .github/workflows/layout-pagination-once.yml
          git commit -m "Refine library title and EPUB pagination"
          git push origin main
