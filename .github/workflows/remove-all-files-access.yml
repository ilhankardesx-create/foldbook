name: Remove All Files Access

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/remove-all-files-access.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Remove all-files access code
        run: python3 scripts/remove_all_files_access.py

      - name: Commit cleanup
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt
          git commit -m "Remove all-files access flow and device scan button"
          git push origin HEAD:development
