name: FoldBook PDF Turn Stability 0.9.24

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PDF turn rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pdf = Path('app/src/main/java/com/foldbook/app/PdfReader.kt')
          p = pdf.read_text()

          p = p.replace('private val pageCache = object : LruCache<String, Bitmap>(64 * 1024) {',
                        'private val pageCache = object : LruCache<String, Bitmap>(96 * 1024) {', 1)

          if 'import androidx.compose.ui.platform.LocalDensity\n' not in p:
              p = p.replace('import androidx.compose.ui.platform.LocalContext\n',
                            'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalDensity\n', 1)

          old = '    val renderWidthPx = (pageWidthPx * 1.45f).toInt().coerceIn(900, 2400)\n'
          new = '''    val densityInfo = LocalDensity.current\n    val spineWidthPx = with(densityInfo) { 8.dp.toPx() }\n    val renderScale = if (twoPage) 1.45f else 1.15f\n    val renderWidthPx = (pageWidthPx * renderScale).toInt().coerceIn(820, 2200)\n'''
          if old not in p:
              raise SystemExit('renderWidth anchor missing')
          p = p.replace(old, new, 1)

          p = p.replace('((it.width - 10f) / 2f).coerceAtLeast(1f)',
                        '((it.width - spineWidthPx) / 2f).coerceAtLeast(1f)', 1)

          old = '''    fun canTurn(direction: Int): Boolean = when (direction) {
        1 -> pageIndex + step < document.pageCount
        -1 -> pageIndex - step >= 0
        else -> false
    }
'''
          new = '''    fun canTurn(direction: Int): Boolean = when (direction) {
        1 -> pageIndex + step < document.pageCount
        -1 -> pageIndex - step >= 0
        else -> false
    }

    var warmingDirection by remember { mutableIntStateOf(0) }

    fun turnAssetIndices(direction: Int): List<Int> {
        return if (twoPage) {
            when (direction) {
                1 -> listOf(pageIndex, pageIndex + 1, pageIndex + 2, pageIndex + 3)
                -1 -> listOf(pageIndex - 2, pageIndex - 1, pageIndex, pageIndex + 1)
                else -> emptyList()
            }
        } else {
            when (direction) {
                1 -> listOf(pageIndex, pageIndex + 1)
                -1 -> listOf(pageIndex - 1, pageIndex)
                else -> emptyList()
            }
        }.filter { it in 0 until document.pageCount }
    }

    fun turnAssetsReady(direction: Int): Boolean {
        if (!canTurn(direction)) return false
        return turnAssetIndices(direction).all {
            document.cachedPage(it, renderWidthPx, theme) != null
        }
    }

    fun warmTurnAssets(direction: Int) {
        if (!canTurn(direction) || warmingDirection == direction) return
        warmingDirection = direction
        scope.launch {
            withContext(Dispatchers.IO) {
                turnAssetIndices(direction).forEach {
                    document.renderPage(it, renderWidthPx, theme)
                }
            }
            if (warmingDirection == direction) warmingDirection = 0
        }
    }
'''
          if old not in p:
              raise SystemExit('canTurn anchor missing')
          p = p.replace(old, new, 1)

          old = '''            val candidates = if (twoPage) {
                listOf(
                    pageIndex - 2,
                    pageIndex - 1,
                    pageIndex,
                    pageIndex + 1,
                    pageIndex + 2,
                    pageIndex + 3
                )
            } else {
                listOf(
                    pageIndex,
                    pageIndex + 1,
                    pageIndex - 1,
                    pageIndex + 2,
                    pageIndex - 2
                )
            }
'''
          new = '''            val candidates = if (twoPage) {
                listOf(
                    pageIndex + 2,
                    pageIndex + 3,
                    pageIndex - 1,
                    pageIndex - 2,
                    pageIndex,
                    pageIndex + 1
                )
            } else {
                listOf(
                    pageIndex + 1,
                    pageIndex - 1,
                    pageIndex,
                    pageIndex + 2,
                    pageIndex - 2
                )
            }
'''
          if old not in p:
              raise SystemExit('prefetch anchor missing')
          p = p.replace(old, new, 1)

          old = '''                    if (direction == 0 || canTurn(direction)) {
                        dragPx = proposed
                        turnDirection = direction
                        dragProgress =
                            (abs(dragPx) / pageWidthPx).coerceIn(0f, 1f)
                    } else {
                        dragPx = proposed.coerceIn(
                            -pageWidthPx * 0.055f,
                            pageWidthPx * 0.055f
                        )
                        dragProgress = 0f
                        turnDirection = 0
                    }
'''
          new = '''                    when {
                        direction == 0 -> {
                            dragPx = 0f
                            dragProgress = 0f
                            turnDirection = 0
                        }

                        canTurn(direction) && turnAssetsReady(direction) -> {
                            dragPx = proposed
                            turnDirection = direction
                            dragProgress =
                                (abs(dragPx) / pageWidthPx).coerceIn(0f, 1f)
                        }

                        canTurn(direction) -> {
                            warmTurnAssets(direction)
                            dragPx = 0f
                            dragProgress = 0f
                            turnDirection = 0
                        }

                        else -> {
                            dragPx = proposed.coerceIn(
                                -pageWidthPx * 0.055f,
                                pageWidthPx * 0.055f
                            )
                            dragProgress = 0f
                            turnDirection = 0
                        }
                    }
'''
          if old not in p:
              raise SystemExit('drag anchor missing')
          p = p.replace(old, new, 1)

          # Replace the single-page 180-degree flip with a stable one-sided peel.
          start = p.find('@Composable\nprivate fun PdfSinglePageSpread(')
          end = p.find('@Composable\nprivate fun PdfTurningPage(', start)
          if start < 0 or end < 0:
              raise SystemExit('single spread block missing')

          single = '''@Composable
private fun PdfSinglePageSpread(
    document: PdfBookDocument,
    pageIndex: Int,
    turnDirection: Int,
    progress: Float,
    theme: ReaderThemeOption,
    renderWidthPx: Int
) {
    val targetIndex = when (turnDirection) {
        1 -> pageIndex + 1
        -1 -> pageIndex - 1
        else -> pageIndex
    }

    Box(
        modifier = Modifier
            .fillMaxSize()
            .padding(horizontal = 2.dp, vertical = 3.dp)
    ) {
        PdfPage(
            document = document,
            index = targetIndex,
            theme = theme,
            renderWidthPx = renderWidthPx,
            modifier = Modifier.fillMaxSize()
        )

        if (turnDirection != 0) {
            PdfSingleTurningPage(
                document = document,
                frontIndex = pageIndex,
                progress = progress,
                direction = turnDirection,
                theme = theme,
                renderWidthPx = renderWidthPx,
                modifier = Modifier
                    .fillMaxSize()
                    .zIndex(4f)
            )
        }
    }
}

@Composable
private fun PdfSingleTurningPage(
    document: PdfBookDocument,
    frontIndex: Int,
    progress: Float,
    direction: Int,
    theme: ReaderThemeOption,
    renderWidthPx: Int,
    modifier: Modifier = Modifier
) {
    val p = progress.coerceIn(0f, 1f)
    val rotation = if (direction == 1) -88f * p else 88f * p
    val origin = if (direction == 1) {
        TransformOrigin(0f, 0.5f)
    } else {
        TransformOrigin(1f, 0.5f)
    }

    Box(
        modifier = modifier.graphicsLayer {
            transformOrigin = origin
            rotationY = rotation
            cameraDistance = 48f
            shadowElevation = 18f * p
            scaleY = 1f - (0.008f * p)
        }
    ) {
        PdfPage(
            document = document,
            index = frontIndex,
            theme = theme,
            renderWidthPx = renderWidthPx,
            modifier = Modifier.fillMaxSize()
        )

        Box(
            modifier = Modifier
                .align(
                    if (direction == 1) Alignment.CenterEnd else Alignment.CenterStart
                )
                .width(18.dp)
                .fillMaxSize()
                .background(Color.Black.copy(alpha = 0.16f * p))
        )
    }
}

'''
          p = p[:start] + single + p[end:]

          # Align the physical two-page leaf with the 8dp spine at the handoff.
          sig_old = '''    theme: ReaderThemeOption,
    renderWidthPx: Int,
    cameraDistanceValue: Float = 30f,
    modifier: Modifier = Modifier
) {'''
          sig_new = '''    theme: ReaderThemeOption,
    renderWidthPx: Int,
    cameraDistanceValue: Float = 30f,
    crossSpine: Boolean = false,
    modifier: Modifier = Modifier
) {'''
          if sig_old not in p:
              raise SystemExit('turning signature anchor missing')
          p = p.replace(sig_old, sig_new, 1)

          anchor = '''    val origin = if (direction == 1) {
        TransformOrigin(0f, 0.5f)
    } else {
        TransformOrigin(1f, 0.5f)
    }

    Box(
        modifier = modifier.graphicsLayer {'''
          replacement = '''    val origin = if (direction == 1) {
        TransformOrigin(0f, 0.5f)
    } else {
        TransformOrigin(1f, 0.5f)
    }
    val spineShiftPx = if (crossSpine) {
        with(LocalDensity.current) { 8.dp.toPx() } * p
    } else {
        0f
    }

    Box(
        modifier = modifier.graphicsLayer {'''
          # There are two matching origin blocks; apply to PdfTurningPage only (after its declaration).
          turn_pos = p.find('@Composable\nprivate fun PdfTurningPage(')
          a_pos = p.find(anchor, turn_pos)
          if a_pos < 0:
              raise SystemExit('turning origin anchor missing')
          p = p[:a_pos] + p[a_pos:].replace(anchor, replacement, 1)

          layer_old = '''            cameraDistance = cameraDistanceValue
            shadowElevation = 20f * (1f - abs(0.5f - p) * 2f)
'''
          layer_new = '''            cameraDistance = cameraDistanceValue
            translationX = when {
                !crossSpine -> 0f
                direction == 1 -> -spineShiftPx
                else -> spineShiftPx
            }
            shadowElevation = 20f * (1f - abs(0.5f - p) * 2f)
'''
          if layer_old not in p:
              raise SystemExit('turning layer anchor missing')
          p = p.replace(layer_old, layer_new, 1)

          # Only PdfTwoPageSpread still calls PdfTurningPage now, so mark both calls cross-spine.
          marker = '                renderWidthPx = renderWidthPx,\n                modifier = Modifier\n'
          count = p.count(marker)
          if count < 2:
              raise SystemExit(f'expected two-page turning calls, found {count}')
          p = p.replace(marker,
                        '                renderWidthPx = renderWidthPx,\n                crossSpine = true,\n                modifier = Modifier\n', 2)

          pdf.write_text(p)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          if 'versionCode = 34' not in g or 'versionName = "0.9.23"' not in g:
              raise SystemExit('version anchor missing')
          g = g.replace('versionCode = 34', 'versionCode = 35', 1)
          g = g.replace('versionName = "0.9.23"', 'versionName = "0.9.24"', 1)
          gradle.write_text(g)

          main = Path('app/src/main/java/com/foldbook/app/MainActivity.kt')
          m = main.read_text()
          m = m.replace('text = "v0.9.23"', 'text = "v0.9.24"', 1)
          main.write_text(m)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and release AAB
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foldbook-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: foldbook-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Commit source update and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pdf-turn-024-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/foldbook/app/PdfReader.kt app/src/main/java/com/foldbook/app/MainActivity.kt app/build.gradle.kts .github/workflows/pdf-turn-024-once.yml
          git commit -m 'Stabilize PDF page turns on phone and fold' || exit 0
          git push
