name: Fix Release Tail Soft Landing

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/fix-release-tail-soft-landing.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Apply release-tail smoothing
        run: python3 scripts/fix_release_tail_soft_landing.py

      - name: Commit patch
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt \
                  app/src/main/java/com/foldbook/app/PdfReader.kt
          git commit -m "Smooth fast page turns and half-release landing"
          git push origin HEAD:development
