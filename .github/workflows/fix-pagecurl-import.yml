name: Fix PageCurl Import

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/fix-pagecurl-import.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
      - name: Add missing draw transform import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/foldbook/app/PageCurl.kt')
          s = p.read_text()
          needle = 'import androidx.compose.ui.graphics.drawscope.scale\n'
          if 'import androidx.compose.ui.graphics.drawscope.withTransform\n' not in s:
              s = s.replace(needle, needle + 'import androidx.compose.ui.graphics.drawscope.withTransform\n', 1)
          p.write_text(s)
          PY
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/PageCurl.kt
          git commit -m "Fix PageCurl draw transform import"
          git push origin HEAD:development
