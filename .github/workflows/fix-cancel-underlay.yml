name: Fix Cancel Underlay

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/fix-cancel-underlay.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Apply cancel underlay fix
        run: python3 scripts/fix_cancel_underlay.py

      - name: Commit patch
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt \
                  app/src/main/java/com/foldbook/app/PdfReader.kt \
                  app/src/main/java/com/foldbook/app/PageCurl.kt
          git commit -m "Fix cancelled page-turn underlay flash"
          git push origin HEAD:development
