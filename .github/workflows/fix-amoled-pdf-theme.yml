name: Fix AMOLED PDF Theme

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/fix-amoled-pdf-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0

      - name: Complete AMOLED PDF theme branches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/foldbook/app/PdfReader.kt')
          s = p.read_text(encoding='utf-8')

          marker = 'ReaderThemeOption.DARK -> Color(0xFFC8FF3D).copy(alpha = 0.42f)'
          sheen = 'ReaderThemeOption.DARK -> Color(0xFFD9FF65).copy(alpha = 0.16f)'
          surface = 'ReaderThemeOption.DARK -> Color(0xFF191919)'

          s = s.replace(
              marker,
              marker + '\n                ReaderThemeOption.AMOLED -> Color(0xFFC8FF3D).copy(alpha = 0.46f)'
          )
          s = s.replace(
              sheen,
              sheen + '\n                ReaderThemeOption.AMOLED -> Color(0xFFD9FF65).copy(alpha = 0.18f)'
          )
          s = s.replace(
              surface,
              surface + '\n            ReaderThemeOption.AMOLED -> Color.Black'
          )

          if 'ReaderThemeOption.AMOLED -> Color(0xFFC8FF3D).copy(alpha = 0.46f)' not in s:
              raise SystemExit('AMOLED marker branch not added')
          if 'ReaderThemeOption.AMOLED -> Color(0xFFD9FF65).copy(alpha = 0.18f)' not in s:
              raise SystemExit('AMOLED sheen branch not added')
          if s.count('ReaderThemeOption.AMOLED -> Color.Black') < 3:
              raise SystemExit('AMOLED black surface branches not added')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit AMOLED PDF completion
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/PdfReader.kt
          git diff --cached --quiet && exit 0
          git commit -m "Complete AMOLED PDF theme"
          git push origin development
