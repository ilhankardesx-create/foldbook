name: Fix Single Page Tail Edge

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/fix-single-page-tail-edge.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development

      - name: Apply single-page tail edge fix
        run: python3 scripts/fix_single_page_tail_edge.py

      - name: Commit patch
        run: |
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/PageCurl.kt
          git commit -m "Remove single-page tail edge flicker"
          git push origin HEAD:development
