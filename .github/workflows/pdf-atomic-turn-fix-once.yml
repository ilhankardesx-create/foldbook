name: FoldBook PDF Atomic Turn Fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PDF atomic page handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pdf = Path('app/src/main/java/com/foldbook/app/PdfReader.kt')
          p = pdf.read_text()

          imp = 'import androidx.compose.runtime.setValue\n'
          new_imp = 'import androidx.compose.runtime.setValue\nimport androidx.compose.runtime.snapshots.Snapshot\n'
          if new_imp not in p:
              if imp not in p:
                  raise SystemExit('Snapshot import anchor missing')
              p = p.replace(imp, new_imp, 1)

          old = '''            if (shouldComplete) {\n                val newIndex = (\n                    pageIndex + if (direction == 1) step else -step\n                ).coerceIn(0, document.pageCount - 1)\n\n                pageIndex = newIndex\n                onPageChanged(newIndex)\n            }\n\n            dragPx = 0f\n            dragProgress = 0f\n            turnDirection = 0\n            settleAnimation.snapTo(0f)\n            settling = false\n'''

          new = '''            if (shouldComplete) {\n                val newIndex = (\n                    pageIndex + if (direction == 1) step else -step\n                ).coerceIn(0, document.pageCount - 1)\n\n                Snapshot.withMutableSnapshot {\n                    pageIndex = newIndex\n                    dragPx = 0f\n                    dragProgress = 0f\n                    turnDirection = 0\n                    settling = false\n                }\n                onPageChanged(newIndex)\n            } else {\n                Snapshot.withMutableSnapshot {\n                    dragPx = 0f\n                    dragProgress = 0f\n                    turnDirection = 0\n                    settling = false\n                }\n            }\n\n            settleAnimation.snapTo(0f)\n'''

          if old not in p:
              raise SystemExit('settleTurn anchor missing')
          p = p.replace(old, new, 1)
          pdf.write_text(p)

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text()
          if 'versionCode = 33' not in g or 'versionName = "0.9.22"' not in g:
              raise SystemExit('version anchor missing')
          g = g.replace('versionCode = 33', 'versionCode = 34', 1)
          g = g.replace('versionName = "0.9.22"', 'versionName = "0.9.23"', 1)
          gradle.write_text(g)

          main = Path('app/src/main/java/com/foldbook/app/MainActivity.kt')
          m = main.read_text()
          m = m.replace('text = "v0.9.22"', 'text = "v0.9.23"', 1)
          main.write_text(m)
          PY

      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/pdf-atomic-turn-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/foldbook/app/PdfReader.kt app/src/main/java/com/foldbook/app/MainActivity.kt app/build.gradle.kts .github/workflows/pdf-atomic-turn-fix-once.yml
          git commit -m 'Make PDF page handoff atomic'
          git push
