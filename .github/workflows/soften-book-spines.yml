name: Soften Book Spines

on:
  push:
    branches: [ "development" ]
    paths: [ ".github/workflows/soften-book-spines.yml" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: development
      - name: Soften EPUB and PDF center spine shadows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/foldbook/app/MainActivity.kt')
          s = main.read_text()
          old = '''private fun BookSpine(progress: Float) {
              val shadowStrength =
                  0.07f + (0.10f * (1f - abs(0.5f - progress) * 2f))
          '''
          new = '''private fun BookSpine(progress: Float) {
              val shadowStrength =
                  0.018f + (0.030f * (1f - abs(0.5f - progress) * 2f))
          '''
          if old not in s:
              raise SystemExit('MainActivity BookSpine strength block not found')
          s = s.replace(old, new, 1)

          marker = 'private fun BookSpine(progress: Float) {'
          start = s.index(marker)
          tail = s[start:]
          old_width = '.width(10.dp)'
          if old_width not in tail:
              raise SystemExit('MainActivity BookSpine width not found')
          tail = tail.replace(old_width, '.width(4.dp)', 1)
          s = s[:start] + tail
          main.write_text(s)

          pdf = Path('app/src/main/java/com/foldbook/app/PdfReader.kt')
          s = pdf.read_text()
          old = 'private fun PdfBookSpine(progress: Float) {\n    val strength = 0.07f + (0.10f * (1f - abs(0.5f - progress) * 2f))'
          new = 'private fun PdfBookSpine(progress: Float) {\n    val strength = 0.018f + (0.030f * (1f - abs(0.5f - progress) * 2f))'
          if old not in s:
              raise SystemExit('PdfBookSpine strength block not found')
          s = s.replace(old, new, 1)

          marker = 'private fun PdfBookSpine(progress: Float) {'
          start = s.index(marker)
          tail = s[start:]
          if '.width(10.dp)' not in tail:
              raise SystemExit('PdfBookSpine width not found')
          tail = tail.replace('.width(10.dp)', '.width(4.dp)', 1)
          s = s[:start] + tail
          pdf.write_text(s)
          PY
          git config user.name "FoldBook Dev Bot"
          git config user.email "actions@github.com"
          git add app/src/main/java/com/foldbook/app/MainActivity.kt app/src/main/java/com/foldbook/app/PdfReader.kt
          git commit -m "Soften center spine shadows"
          git push origin HEAD:development
